<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book an appointment</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- sign up form -->
    <h2>Sign up</h2>
    <input id="su-name" placeholder="Name">
    <input id="su-email" placeholder="Email">
    <input id="su-password" type="password" placeholder="Password (8+ characters)">
    <select id="su-role">
    <option value="customer">Customer</option>
    <option value="owner">Business owner</option>
    </select>
    <button onclick="register()">Sign up</button>
    <p id="signup-msg"></p>

    <!-- login form -->
    <h2>Log in</h2>
    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button onclick="login()">Log in</button>
    <p id="status"></p>  
    <!-- services list -->
    <h1>Services</h1>
    <ul id="services"></ul>

    <!-- now free slots -->

    <h2>Free slots</h2>
    <select id="service-select"></select>
    <input type="date" id="date">
    <button onclick="loadSlots()">Show slots</button>
    <p id="slots-msg"></p>
    <ul id="slots"></ul>

    <p id="book-msg"></p>

    
    <!-- owner tools -->


    <h2>Owner tools</h2>
    <h3>Add a service</h3>
    <input id="svc-name" placeholder="Service name">
    <input id="svc-duration" type="number" placeholder="Minutes">
    <input id="svc-price" type="number" step="0.01" placeholder="Price">
    <button onclick="addService()">Add service</button>
    <p id="svc-msg"></p>

    <h3>Set working hours</h3>
    <select id="av-day">
    <option>Mon</option><option>Tue</option><option>Wed</option>
    <option>Thu</option><option>Fri</option><option>Sat</option><option>Sun</option>
    </select>
    <input id="av-start" type="time">
    <input id="av-end" type="time">
    <button onclick="setHours()">Save hours</button>
    <p id="av-msg"></p>

    <!-- my bookings -->

    <h2>My bookings</h2>
    <button onclick="loadBookings()">Refresh</button>
    <p id="bookings-msg"></p>
    <ul id="bookings"></ul>



<script src="app.js"></script>


</body>
</html>
